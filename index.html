<!DOCTYPE html>
<html>
    <head>
        <title>calculater design</title>
    </head>
    <style>
       

{
margin: 0;
padding: 0;
box-sizing: border-box;
}

body {
min-height: 100vh;
background-color: #121212;
display: flex;
justify-content: center;
align-items: center;
font-family: Arial, sans-serif;
}


.calculator {
width: 320px;
padding: 20px;
background-color: #222831;
border: 3px solid rgb(3, 0, 0);
border-radius: 20px;
box-shadow: 0  2px 12px rgb(253, 253, 253);
 box-sizing: border-box;
}

.display {
height: 90px;
width: 100%;
background-color: rgba(236, 232, 224, 0.938);
color: #222831;
border-radius: 12px;
margin-bottom: 10px;
padding: 15px;

display: flex;
justify-content: flex-end;
align-items: center;
font-size: 35px;
font-weight: bold;
border: 2px solid #393e46;
overflow: hidden;
}


.buttons {
display: grid;
grid-template-columns: repeat(4, 1fr);
gap: 10px;
width: 100%;
}


button {
height: 55px;
border: 1px solid #555555;
border-radius: 10px;
background-color: #393e46;
color: white;
font-size: 20px;
font-weight: bold;
cursor: pointer;
transition: 0.2s;
}
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

.number {
background-color: #393e46;
color: white;
}


.operator {
background-color: #303669fb;
color: white;
border: none;
}


.clear {
background-color: #c53c32;
color: white;
border: none;
}


.equal {
background-color: #208d60;
color: white;
grid-row: span 2;
height: 120px;
border: none;
}


.zero {
grid-column: span 2;
}


button {
opacity: 0.8;
}


@media (max-width: 400px) {
.calculator {
width: 90%;
padding: 15px;
}

button {
    height: 50px;
    font-size: 18px;
}

.display {
    height: 80px;
    font-size: 30px;
}

}
    </style>
    <body>
        <div class="calculator">

    
    <div class="display">0</div>

   
    <div class="buttons">

        <button class="clear">AC</button>
        <button class="clear">C</button>
        <button class="operator">÷</button>
        <button class="operator">×</button>

        <button class="number">7</button>
        <button class="number">8</button>
        <button class="number">9</button>
        <button class="operator">−</button>

        <button class="number">4</button>
        <button class="number">5</button>
        <button class="number">6</button>
        <button class="operator">+</button>

        <button class="number">1</button>
        <button class="number">2</button>
        <button class="number">3</button>
        <button class="equal">=</button>

        <button class="number zero">0</button>
        <button class="number">.</button>

    </div>

</div>
    </body>
</html>
